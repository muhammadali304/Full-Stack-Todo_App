openapi: 3.0.3
info:
  title: AI Chat API
  description: API specification for the ChatKit-based AI chat frontend integration
  version: 1.0.0
  contact:
    name: Todo App Development Team

servers:
  - url: https://api.todoapp.com/v1
    description: Production server
  - url: https://staging.todoapp.com/v1
    description: Staging server
  - url: http://localhost:8000/v1
    description: Development server

paths:
  /api/{user_id}/chat:
    post:
      summary: Process natural language chat request
      description: Process a natural language request from a user to manage their todos via the AI agent
      operationId: processChatRequest
      tags:
        - Chat
      parameters:
        - name: user_id
          in: path
          required: true
          description: The ID of the authenticated user making the request
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: The natural language message from the user
                  example: "Add a task to buy groceries"
                conversation_id:
                  type: string
                  format: uuid
                  description: Optional ID of existing conversation to continue
                  example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Successful response from the AI agent
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: The AI agent's response to the user
                    example: "I've added a task 'buy groceries' to your list."
                  conversation_id:
                    type: string
                    format: uuid
                    description: The ID of the conversation for context tracking
                    example: "123e4567-e89b-12d3-a456-426614174000"
                  tool_calls:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolCall'
                  tool_call_results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolCallResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/{user_id}/chat/stream:
    post:
      summary: Stream chat responses via Server Sent Events
      description: Process a natural language request and stream responses using Server Sent Events
      operationId: streamChatResponse
      tags:
        - Chat
        - Streaming
      parameters:
        - name: user_id
          in: path
          required: true
          description: The ID of the authenticated user making the request
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: The natural language message from the user
                  example: "Show me my tasks"
                conversation_id:
                  type: string
                  format: uuid
                  description: Optional ID of existing conversation to continue
                  example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Streaming response with Server Sent Events
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum: [message_chunk, tool_call, tool_result, error]
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/MessageChunk'
                      - $ref: '#/components/schemas/ToolCall'
                      - $ref: '#/components/schemas/ToolCallResult'
                      - $ref: '#/components/schemas/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/{user_id}/conversations:
    get:
      summary: List user's conversations
      description: Retrieve a list of the authenticated user's chat conversations
      operationId: listConversations
      tags:
        - Conversations
      parameters:
        - name: user_id
          in: path
          required: true
          description: The ID of the authenticated user
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of conversations to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          required: false
          description: Number of conversations to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of user's conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
                  total_count:
                    type: integer
                    description: Total number of conversations for the user
                  limit:
                    type: integer
                    description: Number of conversations returned
                  offset:
                    type: integer
                    description: Number of conversations skipped
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/{user_id}/conversations/{conversation_id}:
    get:
      summary: Get conversation messages
      description: Retrieve all messages in a specific conversation
      operationId: getConversationMessages
      tags:
        - Conversations
      parameters:
        - name: user_id
          in: path
          required: true
          description: The ID of the authenticated user
          schema:
            type: string
        - name: conversation_id
          in: path
          required: true
          description: The ID of the conversation to retrieve
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Maximum number of messages to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of messages to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Messages in the conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatMessage'
                  total_count:
                    type: integer
                    description: Total number of messages in the conversation
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    ChatMessage:
      type: object
      required:
        - id
        - role
        - content
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the message
          example: "123e4567-e89b-12d3-a456-426614174000"
        role:
          type: string
          enum: [user, assistant]
          description: Role of the message sender
          example: "user"
        content:
          type: string
          description: The content of the message
          example: "Add a task to buy groceries"
        created_at:
          type: string
          format: date-time
          description: When the message was created
          example: "2026-01-20T10:30:00Z"
        status:
          type: string
          enum: [sending, streaming, completed, error]
          description: Current status of the message
          default: completed
        tool_calls:
          type: array
          description: Tool calls made during this message interaction
          items:
            $ref: '#/components/schemas/ToolCall'
        tool_call_results:
          type: array
          description: Results from the tool calls
          items:
            $ref: '#/components/schemas/ToolCallResult'
        is_streaming:
          type: boolean
          description: Whether the message content is still being streamed
          default: false

    ToolCall:
      type: object
      required:
        - id
        - name
        - arguments
      properties:
        id:
          type: string
          description: Unique identifier for the tool call
          example: "call_abc123"
        name:
          type: string
          description: Name of the tool being called
          example: "add_task"
        arguments:
          type: object
          description: Arguments passed to the tool
          example:
            title: "buy groceries"
            description: "milk, bread, eggs"
        status:
          type: string
          enum: [pending, executing, completed, error]
          description: Status of the tool call
          default: pending

    ToolCallResult:
      type: object
      required:
        - tool_call_id
        - success
      properties:
        tool_call_id:
          type: string
          description: ID of the corresponding tool call
          example: "call_abc123"
        success:
          type: boolean
          description: Whether the tool call succeeded
          example: true
        data:
          type: object
          description: Result data if the tool call succeeded
          example:
            id: "task_123"
            title: "buy groceries"
            completed: false
        error:
          type: string
          description: Error message if the tool call failed

    MessageChunk:
      type: object
      required:
        - content
        - is_final
      properties:
        content:
          type: string
          description: The chunk of message content
          example: "I'm adding a task to buy groceries"
        is_final:
          type: boolean
          description: Whether this is the final chunk
          default: false
        tool_calls:
          type: array
          description: Tool calls contained in this chunk
          items:
            $ref: '#/components/schemas/ToolCall'

    ErrorMessage:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
          example: "Invalid request parameters"
        details:
          type: string
          description: Additional error details
          example: "Message content is required"

    Conversation:
      type: object
      required:
        - id
        - user_id
        - title
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the conversation
          example: "123e4567-e89b-12d3-a456-426614174000"
        user_id:
          type: string
          description: ID of the user who owns this conversation
          example: "user_123"
        title:
          type: string
          description: Auto-generated title based on first message or topic
          example: "Task management session"
        created_at:
          type: string
          format: date-time
          description: When the conversation was created
          example: "2026-01-20T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: When the conversation was last updated
          example: "2026-01-20T10:30:00Z"
        expires_at:
          type: string
          format: date-time
          description: When the conversation will be archived/purged
          example: "2026-02-19T10:00:00Z"
        message_count:
          type: integer
          description: Number of messages in the conversation
          example: 15

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            error: "Validation failed"
            details: "Message content is required and cannot be empty"

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            error: "Unauthorized"
            details: "Invalid or expired JWT token"

    Forbidden:
      description: Access forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            error: "Forbidden"
            details: "You can only access your own conversations"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            error: "Not Found"
            details: "Conversation not found"

    InternalServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            error: "Internal Server Error"
            details: "An unexpected error occurred processing your request"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from authentication endpoint

security:
  - BearerAuth: []