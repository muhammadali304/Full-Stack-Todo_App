openapi: 3.0.3
info:
  title: MCP Task Tools API
  description: API specification for MCP task management tools
  version: 1.0.0
  contact:
    name: Todo App Development Team
servers:
  - url: https://api.todoapp.com/v1
    description: Production server
  - url: https://staging.todoapp.com/v1
    description: Staging server
  - url: http://localhost:8000/v1
    description: Development server

paths:
  /mcp/tools/add_task:
    post:
      summary: Add a new task
      description: Creates a new task for the authenticated user
      operationId: addTask
      tags:
        - Task Tools
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTaskRequest'
      responses:
        '200':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /mcp/tools/list_tasks:
    post:
      summary: List user's tasks
      description: Retrieves all tasks for the authenticated user
      operationId: listTasks
      tags:
        - Task Tools
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListTasksRequest'
      responses:
        '200':
          description: Tasks retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /mcp/tools/complete_task:
    post:
      summary: Complete a task
      description: Marks a task as completed for the authenticated user
      operationId: completeTask
      tags:
        - Task Tools
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteTaskRequest'
      responses:
        '200':
          description: Task completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /mcp/tools/delete_task:
    post:
      summary: Delete a task
      description: Removes a task from the authenticated user's list
      operationId: deleteTask
      tags:
        - Task Tools
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteTaskRequest'
      responses:
        '200':
          description: Task deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /mcp/tools/update_task:
    post:
      summary: Update a task
      description: Modifies an existing task for the authenticated user
      operationId: updateTask
      tags:
        - Task Tools
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from Better Auth system

  schemas:
    AddTaskRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: The title of the task
          example: "Buy groceries"
          minLength: 1
          maxLength: 255
        description:
          type: string
          description: Optional description of the task
          example: "Milk, bread, eggs"
          maxLength: 1000

    ListTasksRequest:
      type: object
      properties:
        completed:
          type: boolean
          description: Filter tasks by completion status
          example: false
        limit:
          type: integer
          description: Maximum number of tasks to return
          example: 10
          minimum: 1
          maximum: 100
        offset:
          type: integer
          description: Number of tasks to skip
          example: 0
          minimum: 0

    CompleteTaskRequest:
      type: object
      required:
        - task_id
      properties:
        task_id:
          type: string
          format: uuid
          description: The ID of the task to complete
          example: "123e4567-e89b-12d3-a456-426614174000"

    DeleteTaskRequest:
      type: object
      required:
        - task_id
      properties:
        task_id:
          type: string
          format: uuid
          description: The ID of the task to delete
          example: "123e4567-e89b-12d3-a456-426614174000"

    UpdateTaskRequest:
      type: object
      required:
        - task_id
      properties:
        task_id:
          type: string
          format: uuid
          description: The ID of the task to update
          example: "123e4567-e89b-12d3-a456-426614174000"
        title:
          type: string
          description: New title for the task
          example: "Buy groceries - urgent"
          minLength: 1
          maxLength: 255
        description:
          type: string
          description: New description for the task
          example: "Milk, bread, eggs, butter"
          maxLength: 1000
        completed:
          type: boolean
          description: New completion status for the task
          example: true

    TaskResponse:
      type: object
      required:
        - id
        - user_id
        - title
        - completed
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the task
          example: "123e4567-e89b-12d3-a456-426614174000"
        user_id:
          type: string
          description: ID of the user who owns this task
          example: "user-12345"
        title:
          type: string
          description: The title of the task
          example: "Buy groceries"
        description:
          type: string
          description: Optional description of the task
          example: "Milk, bread, eggs"
        completed:
          type: boolean
          description: Whether the task is completed
          example: false
        created_at:
          type: string
          format: date-time
          description: When the task was created
          example: "2023-01-01T12:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: When the task was last updated
          example: "2023-01-01T12:00:00Z"

    TasksResponse:
      type: object
      required:
        - tasks
        - total_count
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskResponse'
        total_count:
          type: integer
          description: Total number of tasks matching the query
          example: 5

    DeleteResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          description: Whether the deletion was successful
          example: true
        message:
          type: string
          description: Message describing the result
          example: "Task deleted successfully"

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Invalid input parameters"
            details: "Title is required and cannot be empty"

    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Unauthorized"
            details: "Invalid or missing JWT token"

    Forbidden:
      description: Access forbidden (user doesn't own the resource)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Forbidden"
            details: "You don't have permission to access this resource"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Not Found"
            details: "Task with specified ID not found"

    InternalServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Internal Server Error"
            details: "An unexpected error occurred"

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
          example: "Something went wrong"
        details:
          type: string
          description: Additional error details
          example: "More specific information about the error"